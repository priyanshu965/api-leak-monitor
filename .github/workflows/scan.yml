name: API Key Leak Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests python-dotenv

      - name: Run scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI: true
          VALIDATE_KEYS: ${{ secrets.VALIDATE_KEYS || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit findings log
        run: |
          if [ -f leaked2.txt ] && [ -s leaked2.txt ]; then
            sort -u findings.log leaked2.txt 2>/dev/null > /tmp/merged.log
            mv /tmp/merged.log findings.log
            git config user.name "scan-bot"
            git config user.email "bot@localhost"
            git add findings.log
            git commit -m "scan: update findings log"
            git push
          fi
