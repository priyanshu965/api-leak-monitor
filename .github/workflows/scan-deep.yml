name: Deep Scan
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: Number of event pages to scan
        default: "10"
        required: false

permissions:
  contents: read

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          wget -q https://github.com/zricethezav/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz -C /usr/local/bin/ gitleaks
          rm gitleaks_8.18.2_linux_x64.tar.gz
      - name: Run deep scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SHODAN_KEY: ${{ secrets.SHODAN_KEY }}
          CENSYS_SECRET: ${{ secrets.CENSYS_SECRET }}
          PASTEBIN_KEY: ${{ secrets.PASTEBIN_KEY }}
          RUN_GITLEAKS: "1"
          DEEP_SCAN: "1"
          SCAN_PAGES: ${{ github.event.inputs.pages || '10' }}
        run: python scanner.py
      - name: Upload findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-deep-${{ github.run_id }}
          path: findings.log
          retention-days: 14
