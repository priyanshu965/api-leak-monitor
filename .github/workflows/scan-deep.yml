name: Deep Scan
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: Number of event pages to scan
        default: "10"
        required: false

permissions:
  contents: read

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore scanner DB
        uses: actions/cache/restore@v4
        id: db-cache
        with:
          path: scanner.db
          key: scanner-db-v1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          wget -q https://github.com/zricethezav/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz -C /usr/local/bin/ gitleaks
          rm gitleaks_8.18.2_linux_x64.tar.gz
      - name: Run deep scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SHODAN_KEY: ${{ secrets.SHODAN_KEY }}
          CENSYS_SECRET: ${{ secrets.CENSYS_SECRET }}
          PASTEBIN_KEY: ${{ secrets.PASTEBIN_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}
          RUN_GITLEAKS: "1"
          DEEP_SCAN: "1"
          SCAN_PAGES: ${{ github.event.inputs.pages || '10' }}
        run: python scanner.py
      - name: Export dashboard data
        run: python export_findings.py
      - name: Commit dashboard data
        run: |
          git config user.email "bot@github.com"
          git config user.name "Dashboard Bot"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "auto: update dashboard data" && git push || true
      - name: Save scanner DB
        uses: actions/cache/save@v4
        if: always()
        with:
          path: scanner.db
          key: scanner-db-v1
      - name: Upload findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-deep-${{ github.run_id }}
          path: findings.log
          retention-days: 14
